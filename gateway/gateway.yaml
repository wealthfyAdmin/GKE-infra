apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: solvox-gateway
  namespace: gateway-system
spec:
  gatewayClassName: gke-l7-global-external-managed

  addresses:
    - type: NamedAddress
      value: solvox-gateway-ip

  listeners:
    # 🌐 HTTP (optional – usually for redirect)
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

    # 🔐 HTTPS – CyberAmbassador API
    - name: cyberambassador-https
      port: 443
      protocol: HTTPS
      hostname: api.cyberambassador.co.in
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cyberambassador-tls
      allowedRoutes:
        namespaces:
          from: All

    # 🔐 HTTPS – ArgoCD UI
    - name: argo-https
      port: 443
      protocol: HTTPS
      hostname: argo.solvox.ai
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argo-tls
      allowedRoutes:
        namespaces:
          from: All
